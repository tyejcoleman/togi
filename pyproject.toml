[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "togi"
version = "0.1.0"
description = "Togi: an agent-native CLI host. Learn a tool in one call, use it with token-cheap output, improve it under audit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp"]
dev = ["pytest"]

[project.scripts]
togi = "togi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
